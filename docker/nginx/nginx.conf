resolver 127.0.0.11 valid=5s ipv6=off;

upstream engines {
  zone engines 64k;
  server matching-engine-1:3001 resolve max_fails=2 fail_timeout=2s;
  server matching-engine-2:3001 resolve max_fails=2 fail_timeout=2s;
}

upstream engine_sockets {
  zone engine_sockets 64k;
  server matching-engine-1:3001 resolve max_fails=2 fail_timeout=2s;
  server matching-engine-2:3001 resolve max_fails=2 fail_timeout=2s;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 3001;

  error_page 502 504 =503 @unavailable;

  location @unavailable {
    default_type application/json;
    return 503 '{"statusCode":503,"message":"Service temporarily unavailable, try again shortly"}';
  }

  location /socket.io/ {
    proxy_pass http://engine_sockets;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503;
  }

  location /trades/summary {
    proxy_pass http://engines;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 70s;
    proxy_next_upstream off;
  }

  location /auth/admins/ {
    proxy_pass http://engines;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_next_upstream error http_502 http_503;
    proxy_next_upstream_tries 2;
  }

  location /auth/ {
    proxy_pass http://engines;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 8s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 16s;
  }

  location / {
    proxy_pass http://engines;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 4s;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 8s;
  }
}
