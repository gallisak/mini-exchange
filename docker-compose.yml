services:
  exchange-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange
      POSTGRES_DB: exchange
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - exchange-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U exchange -d exchange']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'always']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: ./apps/matching-engine-service
    env_file: ./apps/matching-engine-service/.env.example
    environment:
      DATABASE_HOST: exchange-db
    command: ['npm', 'run', 'migration:run:prod']
    depends_on:
      exchange-db:
        condition: service_healthy
    restart: 'no'

  matching-engine-1: &matching-engine
    build: ./apps/matching-engine-service
    env_file: ./apps/matching-engine-service/.env.example
    environment:
      DATABASE_HOST: exchange-db
      REDIS_HOST: redis
      INSTANCE_ID: engine-1
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      exchange-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  matching-engine-2:
    <<: *matching-engine
    environment:
      DATABASE_HOST: exchange-db
      REDIS_HOST: redis
      INSTANCE_ID: engine-2

  matching-engine-service:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - matching-engine-1
      - matching-engine-2
    ports:
      - '3001:3001'

  settlement-migrate:
    build: ./apps/settlement-service
    env_file: ./apps/settlement-service/.env.example
    command: ['npm', 'run', 'migration:run:prod']
    depends_on:
      exchange-db:
        condition: service_healthy
    restart: 'no'

  settlement-service:
    build: ./apps/settlement-service
    env_file: ./apps/settlement-service/.env.example
    restart: unless-stopped
    depends_on:
      exchange-db:
        condition: service_healthy
      settlement-migrate:
        condition: service_completed_successfully
    ports:
      - '3002:3002'

  frontend:
    build:
      context: ./apps/frontend
      args:
        NEXT_PUBLIC_WS_URL: ws://localhost:3001
    env_file: ./apps/frontend/.env.example
    environment:
      MATCHING_ENGINE_URL: http://matching-engine-service:3001
    depends_on:
      - matching-engine-service
    ports:
      - '3000:3000'

volumes:
  exchange-db-data:
  redis-data:
