name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  matching-engine-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/matching-engine-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/matching-engine-service/package-lock.json
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  matching-engine-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/matching-engine-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: exchange
          POSTGRES_PASSWORD: exchange
          POSTGRES_DB: exchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exchange"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/matching-engine-service/package-lock.json
      - run: npm ci
      - run: npm run test:int

  settlement-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/settlement-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/settlement-service/package-lock.json
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  settlement-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/settlement-service
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: exchange
          POSTGRES_PASSWORD: exchange
          POSTGRES_DB: exchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U exchange"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LEDGER_DATABASE_HOST: localhost
      LEDGER_DATABASE_PORT: 5432
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/settlement-service/package-lock.json
      - run: npm ci
      - run: npm run test:int

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/test-secrets.sh
      - run: ./scripts/test-gateway.sh

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: docker compose up -d --build
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: |
          for attempt in $(seq 1 60); do
            curl -fsS http://localhost:3000/login >/dev/null && curl -fsS http://localhost:3001/health >/dev/null && exit 0
            sleep 2
          done
          exit 1
      - run: node e2e/browser-smoke.mjs
      - run: ./scripts/smoke.sh
      - if: failure()
        run: docker compose ps -a && docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: docker compose -f docker-compose.yml -f docker-compose.chaos.yml up -d --build
      - run: node scripts/chaos/run.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-report
          path: chaos-report.md
          if-no-files-found: ignore
      - if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail 300
      - if: always()
        run: docker compose down -v
