resolver 127.0.0.11 valid=5s ipv6=off;

upstream engines {
  zone engines 64k;
  server matching-engine-1:3001 resolve max_fails=1 fail_timeout=2s;
  server matching-engine-2:3001 resolve max_fails=1 fail_timeout=2s;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 3001;

  location /auth/ {
    proxy_pass http://engines;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503;
  }

  location / {
    proxy_pass http://engines;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503 non_idempotent;
  }
}
