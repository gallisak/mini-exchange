x-instruments: &instruments ABC,DEF,XYZ

x-secrets-loader: &secrets-loader
  entrypoint: ['sh', '/opt/secrets/with-secrets.sh']

services:
  secrets:
    image: alpine:3.20
    command: ['sh', '/opt/secrets/generate.sh']
    volumes:
      - ./docker/secrets:/opt/secrets:ro
      - engine-secrets:/run/exchange/engine
      - settlement-secrets:/run/exchange/settlement
      - frontend-secrets:/run/exchange/frontend
    restart: 'no'

  exchange-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange
      POSTGRES_DB: exchange
    volumes:
      - exchange-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U exchange -d exchange']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'always']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: ./apps/matching-engine-service
    env_file: ./apps/matching-engine-service/.env.example
    environment:
      DATABASE_HOST: exchange-db
      DATABASE_STATEMENT_TIMEOUT_MS: '0'
    <<: *secrets-loader
    command: ['npm', 'run', 'migration:run:prod']
    volumes:
      - ./docker/secrets:/opt/secrets:ro
      - engine-secrets:/run/exchange:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
      exchange-db:
        condition: service_healthy
    restart: 'no'

  matching-engine-1: &matching-engine
    build: ./apps/matching-engine-service
    env_file: ./apps/matching-engine-service/.env.example
    environment:
      DATABASE_HOST: exchange-db
      REDIS_HOST: redis
      INSTANCE_ID: engine-1
      INSTRUMENTS: *instruments
    <<: *secrets-loader
    command: ['node', 'dist/main']
    volumes:
      - ./docker/secrets:/opt/secrets:ro
      - engine-secrets:/run/exchange:ro
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      exchange-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  matching-engine-2:
    <<: *matching-engine
    environment:
      DATABASE_HOST: exchange-db
      REDIS_HOST: redis
      INSTANCE_ID: engine-2
      INSTRUMENTS: *instruments

  matching-engine-service:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - matching-engine-1
      - matching-engine-2
    ports:
      - '127.0.0.1:3001:3001'

  settlement-migrate:
    build: ./apps/settlement-service
    env_file: ./apps/settlement-service/.env.example
    environment:
      DATABASE_STATEMENT_TIMEOUT_MS: '0'
    <<: *secrets-loader
    command: ['npm', 'run', 'migration:run:prod']
    volumes:
      - ./docker/secrets:/opt/secrets:ro
      - settlement-secrets:/run/exchange:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
      exchange-db:
        condition: service_healthy
    restart: 'no'

  settlement-service:
    build: ./apps/settlement-service
    env_file: ./apps/settlement-service/.env.example
    environment:
      INSTRUMENTS: *instruments
    <<: *secrets-loader
    command: ['node', 'dist/main']
    volumes:
      - ./docker/secrets:/opt/secrets:ro
      - settlement-secrets:/run/exchange:ro
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      exchange-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      settlement-migrate:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:3002:3002'

  frontend:
    build:
      context: ./apps/frontend
      args:
        NEXT_PUBLIC_WS_URL: ws://localhost:3001
        NEXT_PUBLIC_INSTRUMENTS: *instruments
    env_file: ./apps/frontend/.env.example
    environment:
      MATCHING_ENGINE_URL: http://matching-engine-service:3001
      SETTLEMENT_URL: http://settlement-service:3002
    <<: *secrets-loader
    command: ['node', 'server.js']
    volumes:
      - ./docker/secrets:/opt/secrets:ro
      - frontend-secrets:/run/exchange:ro
    depends_on:
      - matching-engine-service
      - settlement-service

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/web.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  exchange-db-data:
  redis-data:
  engine-secrets:
  settlement-secrets:
  frontend-secrets:
